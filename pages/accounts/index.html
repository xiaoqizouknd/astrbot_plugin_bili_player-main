<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>bili播放器 - 账号与运行状态</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="page-header">
        <div>
          <p class="eyebrow">bili播放器</p>
          <h1>账号与运行状态</h1>
        </div>
        <button class="secondary-button" id="refresh" type="button">刷新状态</button>
      </header>

      <p class="page-message" id="page-message" role="status" hidden></p>

      <section class="account-section" aria-label="Bilibili 账号与运行状态">
        <article class="account-card">
          <div class="account-heading">
            <div>
              <p class="platform-label">Bilibili 账号</p>
              <h2>登录状态</h2>
            </div>
            <span class="status-badge" data-role="state">加载中</span>
          </div>
          <p class="account-name" data-role="name">未登录</p>
          <div class="account-actions">
            <button class="primary-button" data-action="login" type="button">扫码登录</button>
            <button class="danger-button" data-action="logout" type="button" hidden>退出登录</button>
          </div>

          <details class="credential-import">
            <summary>扫码不可用时，手动粘贴 Cookie 登录</summary>
            <div class="credential-form">
              <p class="credential-hint">
                从浏览器开发者工具复制 <code>Cookie</code> 请求头的完整内容（须含 <code>SESSDATA</code>）。
                导入后立即校验，无效或被拒的凭证不会保存。
              </p>
              <textarea id="credential-text" rows="3" placeholder="name=value; name2=value2; ..."></textarea>
              <button class="secondary-button" id="import-credentials" type="button">导入并校验</button>
            </div>
          </details>

          <div class="card-divider"></div>

          <div class="runtime-status" aria-labelledby="runtime-heading">
            <div>
              <p class="platform-label">媒体处理</p>
              <h3 id="runtime-heading">运行状态</h3>
            </div>
            <p id="ffmpeg-status">加载中</p>
          </div>

          <dl class="delivery-summary">
            <div><dt>默认媒体</dt><dd data-role="media">加载中</dd></div>
            <div><dt>音频形式</dt><dd data-role="audio-form">加载中</dd></div>
            <div><dt>视频上限</dt><dd data-role="video-size">加载中</dd></div>
            <div><dt>音频文件上限</dt><dd data-role="download-size">加载中</dd></div>
          </dl>
        </article>
      </section>
    </main>

    <dialog id="login-dialog" aria-labelledby="login-title">
      <form method="dialog" class="dialog-shell">
        <header class="dialog-header">
          <div>
            <p class="platform-label">Bilibili</p>
            <h2 id="login-title">扫码登录</h2>
          </div>
          <button class="icon-button" id="close-login" type="button" aria-label="关闭" title="关闭">×</button>
        </header>
        <div class="qr-stage" id="qr-stage">
          <img id="qr-code" alt="登录二维码" hidden />
          <p id="login-state" role="status">正在生成二维码</p>
        </div>
        <button class="secondary-button dialog-cancel" id="cancel-login" type="button">取消</button>
      </form>
    </dialog>

    <script type="module" src="./app.js"></script>
  </body>
</html>
